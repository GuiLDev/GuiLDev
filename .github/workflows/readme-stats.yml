name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate stats cards
        uses: stats-organization/github-readme-stats-action@v1
        with:
          username: GuiLDev
          theme: radical
          show_icons: true
          hide: issues
          output_dir: generated

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "chore: update GitHub stats"
          git push
